# Third-party runtime dependencies of Embodied DataOps.
# Rule: every entry has an immutable tag / version. `latest` is forbidden.
# Digests are filled in by scripts/pin_versions.sh (docker image inspect) and
# must be refreshed only through an ADR when a dependency is upgraded.

