[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "embodied-dataops"
version = "1.0.0"
description = "Embodied DataOps - multimodal embodied-data production and quality-closed-loop platform"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Embodied DataOps" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "redis>=5.0",
  "boto3>=1.35",
  "httpx>=0.27",
  "pyarrow>=17.0",
  "numpy>=1.26,<2.3",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
  "prometheus-client>=0.21",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "mcap>=1.2",
  "cryptography>=43.0",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "imageio-ffmpeg>=0.6",
  "av>=15.0",
]
ui = [
  "streamlit>=1.40",
]
# Official LeRobot v3 API, pinned by the specification. Heavy (torch); only the
# import/export CPU worker and the export round-trip test need it.
lerobot = [
  "lerobot==0.4.4",
]
vision = [
  "ultralytics>=8.3",
]
ros2 = [
  # rosbag2_py / rosbag2_storage_mcap come from the Ubuntu 24.04 + ROS 2 Jazzy
  # image, never from pip (see services/ros2_adapter and ADR-0003).
]

[project.scripts]
dataops = "embodied_dataops.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/embodied_dataops", "src/embodied_ui"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=300"
markers = [
  "unit: pure in-process unit tests",
  "integration: requires PostgreSQL/Redis/MinIO (TEST_DATABASE_URL etc.)",
  "e2e: requires the running compose stack or an in-process stack",
  "failure: failure-injection tests",
  "contract: external-contract tests (official LeRobot API, OpenAPI)",
  "performance: benchmark/scale tests, excluded from the default fast suite",
  "ros2: requires the ROS 2 Jazzy worker environment",
  "vision: requires real YOLO11n weights",
  "no_db: pure in-process test that must not require PostgreSQL",
  "concurrency: two workers competing on real row locks / unique keys; the release gate",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
